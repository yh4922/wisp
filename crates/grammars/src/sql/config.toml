name = "SQL"
grammar = "sql"
path_suffixes = ["sql", "pgsql", "mysql", "ddl", "dml"]
line_comments = ["-- "]
block_comment = { start = "/*", prefix = "", end = "*/", tab_size = 1 }
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "(", end = ")", close = true, newline = false },
    { start = "[", end = "]", close = true, newline = false },
    { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "`", end = "`", close = true, newline = false, not_in = ["comment", "string"] },
]
