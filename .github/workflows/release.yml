# Build and publish a Wisp release.
#
# Trigger: push a tag `v<version>` where <version> equals `version` in crates/zed/Cargo.toml,
# e.g. `git tag v0.1.0 && git push origin v0.1.0`.
#
# The remote-server asset names/URL are fixed by the client:
#   https://github.com/yh4922/wisp/releases/download/v{version}/wisp-remote-server-{os}-{arch}.gz
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: v<version from crates/zed/Cargo.toml>). Created on the current commit if missing."
        required: false
        default: ""
      draft:
        description: "Create the release as a draft"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Determine version and tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version *= *"\([^"]*\)".*/\1/p}' crates/zed/Cargo.toml | head -n1)"
          if [[ -z "$version" ]]; then
            echo "::error::Could not read version from crates/zed/Cargo.toml"
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            tag="v$version"
          fi
          # The client downloads the remote server from .../download/v{version}/..., so the
          # tag must match the crate version exactly.
          if [[ "$tag" != "v$version" ]]; then
            echo "::error::Tag '$tag' does not match crates/zed/Cargo.toml version '$version' (expected 'v$version')."
            exit 1
          fi
          channel="$(tr -d '[:space:]' < crates/zed/RELEASE_CHANNEL)"
          if [[ "$channel" != "stable" ]]; then
            echo "::error::crates/zed/RELEASE_CHANNEL is '$channel', releases must be built from 'stable'."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Wisp $version ($tag, $channel)"

  remote-server:
    name: Remote server (linux-${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # musl-gcc for C deps of the static build, lld for aarch64-musl
          # (see .cargo/bundle-config.toml), the rest mirrors script/linux.
          sudo apt-get install -y --no-install-recommends \
            musl-tools musl-dev build-essential cmake clang lld pkg-config file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: remote-server-${{ matrix.target }}

      - name: Build remote server (static musl)
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Same as script/bundle-linux: compile C deps with musl-gcc.
          export "CC_${TARGET//-/_}=musl-gcc"
          # Build remote_server on its own to avoid feature unification with other crates.
          cargo --config .cargo/bundle-config.toml build --release \
            --package remote_server --bin wisp-remote-server --target "$TARGET"

      - name: Verify and compress
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/wisp-remote-server"
          file "$bin"
          if ldd "$bin" 2>/dev/null | grep -q '=>'; then
            echo "::error::wisp-remote-server is dynamically linked"
            ldd "$bin"
            exit 1
          fi
          mkdir -p dist
          objcopy --strip-debug --discard-all "$bin" dist/wisp-remote-server
          ./dist/wisp-remote-server version || true
          gzip -9 --stdout dist/wisp-remote-server > "dist/wisp-remote-server-linux-$ARCH.gz"
          rm dist/wisp-remote-server
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wisp-remote-server-linux-${{ matrix.arch }}
          path: dist/wisp-remote-server-linux-${{ matrix.arch }}.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows (x86_64)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      # Makes wisp.exe exit if bin\wisp.exe (the CLI) is missing, like upstream bundles.
      ZED_BUNDLE: "true"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-release

      - name: Setup MSVC Spectre-mitigated libs
        uses: ./.github/actions/setup-msvc-spectre
        with:
          arch: x64

      - name: Check build tools
        run: |
          cmake --version
          rustc --version
          cargo --version

      - name: Build wisp.exe and cli.exe
        run: |
          cargo --config .cargo/bundle-config.toml build --release --package zed --package cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem target\release\wisp.exe, target\release\cli.exe

      - name: Ensure Inno Setup
        run: |
          $iscc = @(
            (Get-Command iscc.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source),
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            # Pin 6.x: Chocolatey/latest may already be Inno Setup 7.
            Write-Host 'Inno Setup 6 not found on runner, installing 6.7.4'
            $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $installer
            $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS'
            if ($p.ExitCode -ne 0) { throw "Inno Setup installer failed: $($p.ExitCode)" }
          } else {
            Write-Host "Inno Setup: $iscc"
          }

      - name: Bundle installer and portable zip
        run: |
          ./script/bundle-windows.ps1 -Version $env:RELEASE_VERSION -TargetDir target\release -OutputDir dist
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wisp-windows-x86_64
          path: |
            dist/Wisp-${{ needs.prepare.outputs.version }}-x86_64-setup.exe
            dist/Wisp-${{ needs.prepare.outputs.version }}-x86_64-portable.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, remote-server, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wisp-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Wisp ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/wisp-remote-server-linux-x86_64.gz
            dist/wisp-remote-server-linux-aarch64.gz
            dist/Wisp-${{ needs.prepare.outputs.version }}-x86_64-setup.exe
            dist/Wisp-${{ needs.prepare.outputs.version }}-x86_64-portable.zip
            dist/SHA256SUMS.txt
