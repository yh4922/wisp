<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a33"/>
      <stop offset="1" stop-color="#0b0e1c"/>
    </linearGradient>
    <linearGradient id="wisp" x1="0.2" y1="1" x2="0.7" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#6d8bff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0fbff"/>
      <stop offset="0.45" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- 主烟丝：从底部光点升起的 S 形曲线 -->
  <path d="M108 190 C 64 150, 170 136, 128 98 C 100 72, 136 54, 160 40"
        fill="none" stroke="url(#wisp)" stroke-width="22" stroke-linecap="round"/>
  <!-- 副烟丝：更细更淡，增加飘动感 -->
  <path d="M146 188 C 188 156, 128 136, 164 108"
        fill="none" stroke="url(#wisp)" stroke-width="11" stroke-linecap="round" opacity="0.6"/>
  <!-- 底部光点（鬼火 / 光标） -->
  <circle cx="108" cy="196" r="30" fill="url(#ember)"/>
  <circle cx="108" cy="196" r="11" fill="#e0fbff"/>
</svg>
